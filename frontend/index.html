<!DOCTYPE html>
<html>
  <head>
    <title>Task Manager</title>

    <link rel="stylesheet" href="styles.css" />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>

  <body class="container mt-5">
    <button onclick="logout()" class="btn btn-danger mb-3">Logout</button>

    <h1 class="mb-4">Task Manager</h1>

    <form id="taskForm" class="mb-4">
      <input
        class="form-control mb-2"
        type="text"
        id="title"
        placeholder="Task title"
        required
      />

      <input
        class="form-control mb-2"
        type="text"
        id="description"
        placeholder="Description"
      />

      <select class="form-control mb-2" id="status">
        <option value="pending">Pending</option>
        <option value="in-progress">In Progress</option>
        <option value="completed">Completed</option>
      </select>

      <button class="btn btn-primary">Add Task</button>
    </form>

    <div class="row mt-4">
      <div class="col-md-4">
        <h5>Pending</h5>

        <ul id="pendingTasks" class="list-group"></ul>
      </div>

      <div class="col-md-4">
        <h5>In Progress</h5>

        <ul id="progressTasks" class="list-group"></ul>
      </div>

      <div class="col-md-4">
        <h5>Completed</h5>

        <ul id="completedTasks" class="list-group"></ul>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <script src="app.js"></script>
  </body>
</html>
