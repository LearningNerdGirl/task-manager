<!doctype html>
<html>
  <head>
    <title>Task Board</title>

    <link rel="stylesheet" href="styles.css" />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>

  <body class="bg-light">
    <!-- NAVBAR -->

    <nav class="navbar navbar-dark bg-dark px-4">
      <span class="navbar-brand">Task Board</span>

      <div>
        <a href="dashboard.html" class="btn btn-secondary btn-sm">Dashboard</a>
        <button onclick="logout()" class="btn btn-danger btn-sm">Logout</button>
      </div>
    </nav>

    <!-- CONTENT -->

    <div class="container mt-4">
      <!-- HEADER + ADD BUTTON -->

      <div class="d-flex justify-content-between mb-3">
        <h4>Your Tasks</h4>

        <button
          class="btn btn-primary"
          data-bs-toggle="modal"
          data-bs-target="#taskModal"
        >
          + Add Task
        </button>
      </div>

      <!-- KANBAN BOARD -->

      <div class="row">
        <div class="col-md-4">
          <h5>Pending</h5>
          <ul id="pendingTasks" class="list-group"></ul>
        </div>

        <div class="col-md-4">
          <h5>In Progress</h5>
          <ul id="progressTasks" class="list-group"></ul>
        </div>

        <div class="col-md-4">
          <h5>Completed</h5>
          <ul id="completedTasks" class="list-group"></ul>
        </div>
      </div>
    </div>

    <!-- ================= ADD TASK MODAL ================= -->

    <div class="modal fade" id="taskModal">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5>Add Task</h5>
            <button class="btn-close" data-bs-dismiss="modal"></button>
          </div>

          <div class="modal-body">
            <form id="taskForm">
              <input
                class="form-control mb-2"
                id="title"
                placeholder="Task title"
                required
              />

              <input
                class="form-control mb-2"
                id="description"
                placeholder="Description"
              />

              <select class="form-control mb-2" id="status">
                <option value="pending">Pending</option>
                <option value="in-progress">In Progress</option>
                <option value="completed">Completed</option>
              </select>

              <button class="btn btn-primary w-100">Add Task</button>
            </form>
          </div>
        </div>
      </div>
    </div>

    <!-- ================= EDIT TASK MODAL ================= -->

    <div class="modal fade" id="editModal">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5>Edit Task</h5>
            <button class="btn-close" data-bs-dismiss="modal"></button>
          </div>

          <div class="modal-body">
            <form id="editForm">
              <input type="hidden" id="editId" />

              <input
                class="form-control mb-2"
                id="editTitle"
                placeholder="Task title"
              />

              <input
                class="form-control mb-2"
                id="editDescription"
                placeholder="Description"
              />

              <select class="form-control mb-2" id="editStatus">
                <option value="pending">Pending</option>
                <option value="in-progress">In Progress</option>
                <option value="completed">Completed</option>
              </select>

              <button type="submit" class="btn btn-warning w-100">Update Task</button>
            </form>
          </div>
        </div>
      </div>
    </div>

    <!-- SCRIPTS -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>

    <script src="app.js"></script>
  </body>
</html>
